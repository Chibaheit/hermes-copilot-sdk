[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-copilot-sdk"
version = "0.1.0"
description = "Opt-in GitHub Copilot SDK model provider for Hermes Agent"
requires-python = ">=3.11,<3.14"
dependencies = ["github-copilot-sdk==1.0.14"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "pytest-asyncio==1.3.0"]

[project.entry-points."hermes_agent.plugins"]
copilot-sdk = "hermes_copilot_sdk:register"

[tool.setuptools.packages.find]
include = ["hermes_copilot_sdk*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
